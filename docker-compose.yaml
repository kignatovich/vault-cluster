services:
  vault1:
    image: hashicorp/vault:1.16
    container_name: vault1
    volumes:
      - ./vault1/data:/vault/data
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_RAFT_NODE_ID: vault1
      VAULT_LOCAL_CONFIG: |
        { 
          "ui": true,
          "storage": {
            "raft": {
              "path": "/vault/data"
            }
          },
          "listener": [
            {
              "tcp": {
                "address": "0.0.0.0:8200",
                "tls_disable": true
              }
            }
          ],
          "api_addr": "http://vault1:8200",
          "cluster_addr": "http://vault1:8201"
        }
    expose:
      - "8200"
      - "8201"
    ports:
      - 8204:8200
    networks:
      - vault-network
    command: "server"

